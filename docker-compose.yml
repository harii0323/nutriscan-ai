services:
  nutriscan-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_APP_ID: ${VITE_APP_ID:-nutriscan-ai}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://nutriscan-ai-xm4u.onrender.com/api}
        VITE_BUSINESS_LEGAL_NAME: ${VITE_BUSINESS_LEGAL_NAME:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER_NAME: ${VITE_GRIEVANCE_OFFICER_NAME:-}
        VITE_GRIEVANCE_EMAIL: ${VITE_GRIEVANCE_EMAIL:-}
        VITE_BUSINESS_ADDRESS: ${VITE_BUSINESS_ADDRESS:-}
        VITE_BUSINESS_JURISDICTION: ${VITE_BUSINESS_JURISDICTION:-}
    container_name: nutriscan-app
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
